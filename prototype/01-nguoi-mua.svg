<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="680" viewBox="0 0 1080 680">
<rect width="1080" height="680" fill="#eef2f6"/><rect x="30" y="24" width="1020" height="630" rx="18" fill="white" stroke="#dfe5ed"/>
<text x="64" y="66" font-family="Arial" font-size="24" font-weight="bold" fill="#17243b">Trợ lý khiếu nại · Hàng không đúng mô tả</text><text x="64" y="91" font-family="Arial" font-size="14" fill="#607086">Góc nhìn người mua · đơn giả DH-1042 · áo khoác 490.000đ</text>
<rect x="64" y="115" width="952" height="73" rx="12" fill="#fff6df" stroke="#f2d482"/><circle cx="90" cy="142" r="14" fill="#143f75"/><text x="86" y="148" font-family="Arial" font-size="15" fill="white">1</text><text x="114" y="146" font-family="Arial" font-size="17" font-weight="bold" fill="#17243b">Chưa đủ căn cứ để quyết tiền</text><text x="114" y="169" font-family="Arial" font-size="13" fill="#735e27">AI hướng dẫn bước tiếp theo; không tự hoàn hoặc từ chối.</text>
<circle cx="79" cy="218" r="14" fill="#143f75"/><text x="75" y="224" font-family="Arial" font-size="15" fill="white">2</text><text x="104" y="224" font-family="Arial" font-size="16" font-weight="bold" fill="#17243b">Căn cứ đang dùng · kiểm tra được</text>
<rect x="64" y="240" width="462" height="112" rx="12" fill="#fafcfe" stroke="#dce4ec"/><text x="83" y="267" font-family="Arial" font-size="14" fill="#607086">Mô tả lưu lúc đặt</text><text x="83" y="304" font-family="Arial" font-size="23" font-weight="bold" fill="#17243b">100% cotton</text><text x="83" y="332" font-family="Arial" font-size="12" fill="#66798e">Snapshot giả lập ngày đặt · nguồn cần lưu chống sửa</text>
<rect x="540" y="240" width="476" height="112" rx="12" fill="#fafcfe" stroke="#dce4ec"/><text x="559" y="267" font-family="Arial" font-size="14" fill="#607086">Mô tả hiện tại</text><text x="559" y="304" font-family="Arial" font-size="23" font-weight="bold" fill="#17243b">cotton pha</text><text x="559" y="332" font-family="Arial" font-size="12" fill="#66798e">Chỉ đối chiếu, không thay thế bản lúc đặt</text>
<rect x="64" y="368" width="952" height="88" rx="10" fill="#edf5ff"/><text x="84" y="395" font-family="Arial" font-size="14" fill="#17243b">Mình thấy mô tả lúc đặt ghi “100% cotton”, còn trang hiện tại ghi “cotton pha”.</text><text x="84" y="420" font-family="Arial" font-size="14" fill="#17243b">Ảnh tem ghi “65% polyester, 35% cotton”. Hãy kiểm tra bằng chứng rồi xác nhận gửi yêu cầu.</text><text x="84" y="443" font-family="Arial" font-size="14" fill="#17243b">Shop sẽ được phản hồi trước khi nhân viên quyết định.</text>
<text x="64" y="492" font-family="Arial" font-size="14" font-weight="bold" fill="#607086">Bằng chứng đã có: Ảnh tem · 65% polyester, 35% cotton</text><circle cx="79" cy="528" r="14" fill="#143f75"/><text x="75" y="534" font-family="Arial" font-size="15" fill="white">3</text><text x="104" y="534" font-family="Arial" font-size="14" fill="#17243b">Cần kiểm tra: ảnh toàn bộ áo và tem rõ nét</text>
<rect x="64" y="559" width="306" height="48" rx="10" fill="#f05a28"/><text x="84" y="589" font-family="Arial" font-size="14" font-weight="bold" fill="white">[3] Kiểm tra và xác nhận gửi</text><rect x="381" y="559" width="170" height="48" rx="10" fill="#e8eef7"/><text x="405" y="589" font-family="Arial" font-size="14" font-weight="bold" fill="#22466e">Sửa bằng chứng</text><rect x="562" y="559" width="197" height="48" rx="10" fill="white" stroke="#b9cde5"/><text x="581" y="589" font-family="Arial" font-size="14" font-weight="bold" fill="#245aa0">[4] Chuyển nhân viên</text>
<text x="64" y="632" font-family="Arial" font-size="12" fill="#738198">[5] Sau khi chuyển: “Hủy chuyển” hiện đến khi nhân viên nhận. Ảnh minh họa cùng vị trí trong prototype.</text>
</svg>
